description: "RE Template Fill — LLM Stage Evals"

providers:
  - id: anthropic:messages:claude-sonnet-4-6
    config:
      max_tokens: 4096

prompts:
  - label: structured_output
    config:
      messages:
        - role: system
          content: "{{system_prompt}}"
        - role: user
          content: "{{user_message}}"

# Run all stages at once, or override per stage:
#   npx promptfoo eval --tests datasets/detect_fields.jsonl
#   npx promptfoo eval --tests datasets/extract_schema_fields.jsonl
#   npx promptfoo eval --tests datasets/auto_map_fields.jsonl
#   npx promptfoo eval --tests datasets/extract_table_values_rag_single.jsonl
tests: datasets/extract_schema_fields.jsonl
