# Railway deployment configuration
# https://docs.railway.com/reference/config-as-code
#
# Service names here MUST match the service names in your Railway dashboard exactly.

# ─── API ────────────────────────────────────────────────────────────────────

[services.api.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[services.api.deploy]
startCommand = "sh -c 'python -Xfrozen_modules=off -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1 --log-config uvicorn_log_config.json'"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# ─── Celery worker — critical queue (template fills, PE workflows, extractions) ──

[services.worker-critical.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[services.worker-critical.deploy]
startCommand = "python -Xfrozen_modules=off -m celery -A app.celery_app.celery_app worker --loglevel=info --pool=solo -Q critical --logfile=/dev/stdout"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# ─── Celery worker — default queue (document upload/indexing) ────────────────

[services.worker-default.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[services.worker-default.deploy]
startCommand = "python -Xfrozen_modules=off -m celery -A app.celery_app.celery_app worker --loglevel=info --pool=solo -Q default --logfile=/dev/stdout"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# ─── Celery Beat — task scheduler ────────────────────────────────────────────
# NEVER run more than 1 replica — duplicate schedules cause duplicate tasks.

[services.beat.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker"

[services.beat.deploy]
startCommand = "python -Xfrozen_modules=off -m celery -A app.celery_app.celery_app beat --loglevel=info --logfile=/dev/stdout"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
