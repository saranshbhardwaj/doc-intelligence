# Tables with dynamic rows (rent roll, operating statement, etc.)
tables:
# --- Napkin SHEET - Market Metrics Table ---
  - id: "napkin_market_metrics"
    sheet: "Napkin"
    data_start_row: 19
    data_end_row: 21  # Only 3 rows of metrics
    row_identifier_column: "K"  # Column K contains the metric names
    columns:
      - excel_column: "K"
        header: "Metric"
        data_type: "text"
        pdf_aliases:
          - "Market Cap Rate"
          - "Market Value at Current Rents"
          - "Market Value at Market Rents"
          - "Cap Rate"

      # Columns M-Y contain percentage values (no headers for these columns)
      - excel_column: "M"
        data_type: "percentage"

      - excel_column: "N"
        data_type: "percentage"

      - excel_column: "O"
        data_type: "percentage"

      - excel_column: "P"
        data_type: "percentage"

      - excel_column: "Q"
        data_type: "percentage"

      - excel_column: "R"
        data_type: "percentage"

      - excel_column: "S"
        data_type: "percentage"

      - excel_column: "T"
        data_type: "percentage"

      - excel_column: "U"
        data_type: "percentage"

      - excel_column: "V"
        data_type: "percentage"

      - excel_column: "W"
        data_type: "percentage"

      - excel_column: "X"
        data_type: "percentage"

      - excel_column: "Y"
        data_type: "percentage"

# --- Napkin SHEET - Sale Scenarios Table ---
  - id: "napkin_sale_scenarios"
    sheet: "Napkin"
    header_row: 36
    data_start_row: 37
    # No row_identifier_column - rows are not explicitly labeled
    columns:
      - excel_column: "Q"
        header: "Cap rate at sale"
        data_type: "percentage"
        pdf_aliases:
          - "Cap rate at sale"
          - "Exit Cap Rate"
          - "Sale Cap Rate"
          - "Terminal Cap Rate"
          - "Disposition Cap Rate"

# --- Actuals & Unit Mix SHEET - Target rent analysis ---
  - id: "actuals_unit_mix_target_rent_analysis"
    sheet: "Actuals&UnitMix"
    header_row: 4
    data_start_row: 5
    data_end_row: 16  # Only 12 rows of rent analysis
    row_identifier_column: "G"  # Column with rent analysis categories
    columns:
      - excel_column: "G"
        header: "Type"
        data_type: "text"
        pdf_aliases:
          - "Target Rent Analysis Type"
          - "Rent Analysis Type"
          - "Rent Category"
          - "Rent Type"

      - excel_column: "H"
        header: "# Units"
        data_type: "number"
        pdf_aliases:
          - "Number of Units"
          - "Units"
          - "Unit Count"
          - "Size"

      - excel_column: "I"
        header: "Sqft"
        data_type: "number"
        pdf_aliases:
          - "Square Feet"
          - "SqFt"
          - "Size"

# --- Actuals & Unit Mix SHEET - Current rent analysis ---
  - id: "actuals_unit_mix_current_rent_analysis"
    sheet: "Actuals&UnitMix"
    header_row: 4
    data_start_row: 5
    data_end_row: 16  # Only 12 rows of rent analysis
    row_identifier_column: "K"  # Column with rent analysis categories
    columns:
      - excel_column: "K"
        header: "Average"
        data_type: "currency"
        pdf_aliases:
          - "Current Rent Analysis Type"
          - "Current Rent Category"
          - "Current Rent Type"
 

