      - "Pref to Class B"
      - "Preferred Return to LPs"
  
  - id: "class_b_total_accrue"
    sheet: "DASHBOARD"
    label_cell: "K7"
    value_cell: "L7"
    data_type: "percentage"
    pdf_aliases:
