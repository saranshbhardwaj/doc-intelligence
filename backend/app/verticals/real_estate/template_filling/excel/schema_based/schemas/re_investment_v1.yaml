# --- Actuals & Unit Mix SHEET - Storage unit mix and current rent ---
  - id: "actuals_unit_mix_storage_unit_mix"
    sheet: "Actuals&UnitMix"
    header_row: 4
    data_start_row: 5
    data_end_row: 19
    row_identifier_column: "G"
    description: "Storage-only unit mix and current average rent rows for the Actuals & Unit Mix sheet."
    extraction_rule: "Extract one row per storage unit size/type. Include climate-controlled and non-climate storage. Exclude parking rows. Exclude residential rows. Exclude office, retail, and other non-storage rows. Keep current rent average aligned to the same row as the unit type."
    source_period: "current"
    source_basis: "om_unit_mix"
    fill_when: ["unit_mix_present"]
    requires_structure: []
    columns:
      - excel_column: "G"
        header: "Type"
        data_type: "text"
        pdf_aliases:
          - "Unit Type"
          - "Type"
          - "Floor Plan"
          - "Unit Mix"

      - excel_column: "H"
        header: "# Units"
        data_type: "number"
        pdf_aliases:
          - "# Units"
          - "Number of Units"
          - "Units"
          - "Unit Count"

      - excel_column: "I"
        header: "SqFt"
        data_type: "number"
        pdf_aliases:
          - "Sq.Ft./Unit"
          - "Sq Ft"
          - "Square Feet"
          - "SF"

      - excel_column: "K"
        header: "Current Rent Average"
        data_type: "currency"
        pdf_aliases:
          - "Average Rent"
          - "Avg Rent"
          - "Current Rent"
          - "In-Place Rent"
          - "Rent/Unit"
 

