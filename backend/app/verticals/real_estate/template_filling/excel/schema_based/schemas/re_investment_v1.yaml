    value_cell: "L8"
    data_type: "percentage"
    pdf_aliases:
      - "Class B Hurdle"
      - "IRR Hurdle for Class B"
      - "Preferred Return Hurdle for Class B"
      - "Hurdle for LPs"

  - id: "class_b_post_hurdle"
    sheet: "DASHBOARD"
    label_cell: "K9"
    value_cell: "L9"
    data_type: "percentage"
    pdf_aliases:
      - "Class B % Post Hurdle"
      - "Class B % after Preferred"
      - "Class B % after IRR Hurdle"
      - "Class B % after Preferred Return"
      - "LP Split after Hurdle"
  
  # --- Napkin SHEET - Napkin analyzer ---
  - id: "napkin_ask_price"
    sheet: "Napkin"
    label_cell: "B8"
    value_cell: "C8"
    data_type: "currency"
    pdf_aliases:
      - "Asking Price"
      - "Listing Price"
      - "Sale Price"
      - "Offer Price"
      - "Price"
  
  - id: "napkin_expense_per_unit"
    sheet: "Napkin"
