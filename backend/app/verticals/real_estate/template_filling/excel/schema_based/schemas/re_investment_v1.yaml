# Real Estate Investment Model Template - Version 1
# This schema defines critical fields with known locations in the Excel template
# Format: Define fingerprint cells for identification, then critical fields with their PDF aliases

schema_id: "re_investment_v1"
version: "1.0"
name: "RE Investment Model"
description: "Standard real estate investment analysis model with 21 sheets"

# Fingerprint cells - used to identify this template (check 3-5 unique cells)
fingerprint:
  - sheet: "DASHBOARD"
    cell: "B6"
    expected_value: "Unit Count"
  - sheet: "DASHBOARD"
    cell: "B8"
    expected_value: "Asking Price"
  - sheet: "DASHBOARD"
    cell: "B10"
    expected_value: "Purchase Price"

# Critical fields - define 50-100 most important fields
# Fields not defined here will be handled by generic analyzer + LLM
fields:

  # --- redIQ Sheet - Key Investment Highlights ---

  - id: "rediq_deal_name"
    sheet: "redIQ"
    label_cell: "D2"
    value_cell: "F2"
    data_type: "text"
    pdf_aliases:
      - "Deal Name"
      - "Property Name"
      - "Asset Name"

  - id: "rediq_city"
    sheet: "redIQ"
    label_cell: "D3"
    value_cell: "F3"
    data_type: "text"
    pdf_aliases:
      - "City"
      - "Location City"

  - id: "rediq_state"
    sheet: "redIQ"
    label_cell: "D4"
    value_cell: "F4"
    data_type: "text"
    pdf_aliases:
      - "State"
      - "State Code"

  - id: "rediq_zip"
    sheet: "redIQ"
    label_cell: "D5"
    value_cell: "F5"
    data_type: "text"
    pdf_aliases:
      - "Zip"
      - "Zip Code"
      - "Postal Code"

  - id: "rediq_address"
    sheet: "redIQ"
    label_cell: "D6"
    value_cell: "F6"
    data_type: "text"
    pdf_aliases:
      - "Address"
      - "Street Address"
      - "Property Address"

  - id: "rediq_msa"
    sheet: "redIQ"
    label_cell: "D7"
    value_cell: "F7"
    data_type: "text"
    pdf_aliases:
      - "MSA"
      - "Metropolitan Area"
      - "Market"

  - id: "rediq_year_built"
    sheet: "redIQ"
    label_cell: "D8"
    value_cell: "F8"
    data_type: "number"
    pdf_aliases:
      - "Year Built"
      - "Construction Year"
      - "Built"

  - id: "rediq_year_renovated"
    sheet: "redIQ"
    label_cell: "D9"
    value_cell: "F9"
    data_type: "number"
    pdf_aliases:
      - "Year Renovated"
      - "Renovation Year"
      - "Renovated"

  - id: "rediq_asset_class"
    sheet: "redIQ"
    label_cell: "D10"
    value_cell: "F10"
    data_type: "text"
    pdf_aliases:
      - "Asset Class"
      - "Class"
      - "Property Class"

  - id: "rediq_num_buildings"
    sheet: "redIQ"
    label_cell: "D11"
    value_cell: "F11"
    data_type: "number"
    pdf_aliases:
      - "# Buildings"
      - "Number of Buildings"
      - "Buildings"

  - id: "rediq_num_parking"
    sheet: "redIQ"
    label_cell: "D12"
    value_cell: "F12"
