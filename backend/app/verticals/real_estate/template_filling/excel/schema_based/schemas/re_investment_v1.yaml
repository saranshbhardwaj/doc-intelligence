# Real Estate Investment Model Template - Version 1
# This schema defines critical fields with known locations in the Excel template
# Format: Define fingerprint cells for identification, then critical fields with their PDF aliases

schema_id: "re_investment_v1"
version: "1.0"
name: "RE Investment Model"
description: "Standard real estate investment analysis model with 21 sheets"
total_sheets: 21

# Fingerprint cells - used to identify this template (check 3-5 unique cells)
fingerprint:
  - sheet: "DASHBOARD"
    cell: "B6"
    expected_value: "Unit Count"
  - sheet: "DASHBOARD"
    cell: "B8"
    expected_value: "Asking Price"
  - sheet: "DASHBOARD"
    cell: "B10"
    expected_value: "Purchase Price"

# Critical fields - define 50-100 most important fields
# Fields not defined here will be handled by generic analyzer + LLM
fields:

  # --- redIQ Sheet - Key Investment Highlights ---

  - id: "rediq_deal_name"
    sheet: "redIQ"
    label_cell: "D2"
    value_cell: "F2"
    data_type: "text"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    pdf_aliases:
      - "Deal Name"
      - "Property Name"
      - "Asset Name"

  - id: "rediq_city"
    sheet: "redIQ"
    label_cell: "D3"
    value_cell: "F3"
    data_type: "text"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    pdf_aliases:
      - "City"
      - "Location City"

  - id: "rediq_state"
    sheet: "redIQ"
    label_cell: "D4"
    value_cell: "F4"
    data_type: "text"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    pdf_aliases:
      - "State"
      - "State Code"

  - id: "rediq_zip"
    sheet: "redIQ"
    label_cell: "D5"
    value_cell: "F5"
    data_type: "text"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    pdf_aliases:
      - "Zip"
      - "Zip Code"
      - "Postal Code"

  - id: "rediq_address"
    sheet: "redIQ"
    label_cell: "D6"
    value_cell: "F6"
    data_type: "text"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    description: "Full street address of the property including city, state, and zip."
    extraction_rule: "Use the full street address including number, street, city, state, and zip. Format: '1234 Main St, City, ST 12345'."
    pdf_aliases:
      - "Address"
      - "Street Address"
      - "Property Address"
      - "Site Address"
      - "Location"
      - "Property Location"

  - id: "rediq_msa"
    sheet: "redIQ"
    label_cell: "D7"
    value_cell: "F7"
    data_type: "text"
    source_period: "static"
    source_basis: "om_market_summary"
    fill_when: ["market_summary_present"]
    requires_structure: []
    pdf_aliases:
      - "MSA"
      - "Metropolitan Area"
      - "Market"

  - id: "rediq_year_built"
    sheet: "redIQ"
    label_cell: "D8"
    value_cell: "F8"
    data_type: "number"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    pdf_aliases:
      - "Year Built"
      - "Construction Year"
      - "Built"

  - id: "rediq_year_renovated"
    sheet: "redIQ"
    label_cell: "D9"
    value_cell: "F9"
    data_type: "number"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    pdf_aliases:
      - "Year Renovated"
      - "Renovation Year"
      - "Renovated"

  - id: "rediq_asset_class"
    sheet: "redIQ"
    label_cell: "D10"
    value_cell: "F10"
    data_type: "text"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    pdf_aliases:
      - "Asset Class"
      - "Class"
      - "Property Class"

  - id: "rediq_num_buildings"
    sheet: "redIQ"
    label_cell: "D11"
    value_cell: "F11"
    data_type: "number"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    pdf_aliases:
      - "# Buildings"
      - "Number of Buildings"
      - "Buildings"

  - id: "rediq_num_parking"
    sheet: "redIQ"
    label_cell: "D12"
    value_cell: "F12"
    data_type: "number"
    source_period: "static"
    source_basis: "om_unit_mix"
    fill_when: ["unit_mix_present"]
    requires_structure: []
    pdf_aliases:
      - "# Parking"
      - "Number of Parking"
      - "Parking Spaces"
      - "Parking"

  - id: "rediq_acres"
    sheet: "redIQ"
    label_cell: "D13"
    value_cell: "F13"
    data_type: "number"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    pdf_aliases:
      - "Acres"
      - "Lot Size"
      - "Land Size"

  - id: "rediq_units"
    sheet: "redIQ"
    label_cell: "D14"
    value_cell: "F14"
    data_type: "number"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    pdf_aliases:
      - "Units"
      - "Total Units"
      - "Unit Count"
      - "# Units"

  - id: "rediq_management"
    sheet: "redIQ"
    label_cell: "D15"
    value_cell: "F15"
    data_type: "text"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    pdf_aliases:
      - "Management Software"        # exact label p10
      - "Property Management"
      - "Manager"
      - "Management"

  - id: "rediq_rr_as_of_date"
    sheet: "redIQ"
    label_cell: "D16"
    value_cell: "F16"
    data_type: "date"
    source_period: "static"
    source_basis: "om_rent_roll"
    fill_when: ["rent_roll_present"]
    requires_structure: []
    pdf_aliases:
      - "RR as of Date"
      - "Rent Roll Date"
      - "As of Date"

  # --- DASHBOARD SHEET - Property Info ---

  - id: "property_name"
    sheet: "DASHBOARD"
    label_cell: "B3"
    value_cell: "C3"
    data_type: "text"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    description: "The name of the self-storage property or facility being analyzed."
    extraction_rule: "Use the official property or facility name. For self-storage, this is typically the brand/trade name of the storage facility (e.g. 'Tulsa Self Storage', 'CubeSmart Tulsa'). Do not include the full address."
    pdf_aliases:
      - "Property Name"
      - "Complex Name"
      - "Facility Name"
      - "Asset Name"
      - "Building Name"
      - "Store Name"
      - "Storage Facility"
      - "Self Storage Facility"
      - "Property"
      - "Site Name"

  - id: "property_address"
    sheet: "DASHBOARD"
    label_cell: "B4"
    value_cell: "C4"
    data_type: "text"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    description: "Full street address of the property including city, state, and zip code."
    extraction_rule: "Use the full street address. Include street number, street name, city, state, and zip code. Format: '1234 Main St, City, ST 12345'."
    pdf_aliases:
      - "Property Address"
      - "Address"
      - "Location"
      - "Street Address"
      - "Site Address"
      - "Property Location"

  - id: "storage_unit_count"
    sheet: "DASHBOARD"
    label_cell: "B6"
    value_cell: "C6"
    data_type: "number"
    source_period: "static"
    source_basis: "om_unit_mix"
    fill_when: ["unit_mix_present"]
    requires_structure: []
    description: "Storage rentable unit count for the Dashboard. Include climate-controlled and non-climate storage units only; exclude parking, residential, office, retail, and other non-storage spaces."
    extraction_rule: "If the OM has a unit mix, sum only rows that are storage units. Do not use total units if that total includes parking, residential, or other non-storage spaces. If storage-only count cannot be determined, leave null."
    pdf_aliases:
      - "Storage Units"
      - "Storage Unit Count"
      - "Total Storage Units"
      - "Self Storage Units"
      - "Non-Climate Units"
      - "Climate-Controlled Units"
      - "Total Rentable Units"

  # --- DASHBOARD SHEET - Purchase Section ---

  - id: "asking_price"
    sheet: "DASHBOARD"
    label_cell: "B8"
    value_cell: "C8"
    data_type: "currency"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    pdf_aliases:
      - "Asking Price"
      - "Listing Price"
      - "Sale Price"
      - "Offer Price"
      - "Price"

  # Purchase Price (C10) is analyst input — not extracted from OM

  # DEBT section (I5-I8): analyst underwriting assumptions — not extracted from OM
  # REFI/EXIT section (I29-I32): analyst projections — not extracted from OM

  # Dashboard waterfall cells (L4, L6:L9) are investor structure assumptions — not extracted from OM
  
  # --- Napkin SHEET - Napkin analyzer ---
  - id: "napkin_ask_price"
    sheet: "Napkin"
    label_cell: "B8"
    value_cell: "C8"
    data_type: "currency"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    pdf_aliases:
      - "Asking Price"
      - "Listing Price"
      - "Sale Price"
      - "Offer Price"
      - "Price"
  
  - id: "napkin_current_expense_per_unit"
    sheet: "Napkin"
    label_cell: "B10"
    value_cell: "C10"
    data_type: "currency"
    source_period: "current"
    source_basis: "om_operating_statement"
    fill_when: ["t12_present", "current_operating_statement_present"]
    requires_structure: ["column_map.t12", "column_map.current"]
    description: "Current or in-place operating expense per storage unit for the Napkin current screen."
    extraction_rule: "Use current or in-place operating expenses divided by storage-only unit count. Exclude parking and residential units from the denominator. Do not use pro forma, stabilized, or Year 1 expense per unit."
    pdf_aliases:
      - "Current Expense per Unit"
      - "Current Operating Expense per Unit"
      - "In-Place Expense per Unit"
      - "Current Opex per Unit"
      - "Current Expenses / Unit"
  
  - id: "napkin_walk_in_cap_rate"
    sheet: "Napkin"
    label_cell: "B11"
    value_cell: "C11"
    data_type: "percentage"
    source_period: "current"
    source_basis: "om_operating_statement"
    fill_when: ["t12_present", "current_operating_statement_present"]
    requires_structure: ["column_map.t12", "column_map.current"]
    description: "Current or in-place cap rate for the Napkin current screen."
    extraction_rule: "Use the OM-stated current/in-place/walk-in cap rate, or current NOI divided by asking price if the current cap rate is not stated. Do not use pro forma or exit cap rate."
    pdf_aliases:
      - "Walk-in Cap Rate"
      - "Cap Rate based on Current Rent Roll"
      - "Current Cap Rate"
      - "In-Place Cap Rate"

  - id: "napkin_economic_vacancy_rate_current"
    sheet: "Napkin"
    label_cell: "B12"
    value_cell: "C12"
    data_type: "percentage"
    source_period: "current"
    source_basis: "om_operating_statement"
    fill_when: ["t12_present", "current_operating_statement_present"]
    requires_structure: ["column_map.t12", "column_map.current"]
    description: "Current economic vacancy rate for the Napkin current screen."
    extraction_rule: "Use current or in-place economic vacancy / vacancy and credit loss. Do not use physical vacancy alone, rent concessions alone, Year 1 vacancy, or pro forma vacancy."
    pdf_aliases:
      - "Current Economic Vacancy"
      - "Economic Vacancy (Current)"
      - "Current Vacancy Rate"
      - "In-Place Vacancy Rate"
      - "Current Vacancy & Credit Loss"
      - "Total Economic Vacancy Current"

# --- Napkin SHEET - Helpful data to track ---
  - id: "napkin_year_built"
    sheet: "Napkin"
    label_cell: "B30"
    value_cell: "C30"
    data_type: "number"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    description: "Year the storage facility was built."
    pdf_aliases:
      - "Year Built"
      - "Construction Year"
      - "Building Year"
      - "Built Year"

  - id: "napkin_storage_unit_count"
    sheet: "Napkin"
    label_cell: "B31"
    value_cell: "C31"
    data_type: "number"
    source_period: "static"
    source_basis: "om_unit_mix"
    fill_when: ["unit_mix_present"]
    requires_structure: []
    description: "Storage rentable unit count for the Napkin helper section."
    extraction_rule: "If the OM has a unit mix, sum only climate-controlled and non-climate storage rows. Exclude parking, residential, office, retail, and other non-storage spaces. If storage-only count cannot be determined, leave null."
    pdf_aliases:
      - "Storage Units"
      - "Storage Unit Count"
      - "Total Storage Units"
      - "Self Storage Units"
      - "Non-Climate Units"
      - "Climate-Controlled Units"

  - id: "napkin_total_rentable_sqft"
    sheet: "Napkin"
    label_cell: "B32"
    value_cell: "C32"
    data_type: "number"
    source_period: "static"
    source_basis: "om_property_summary"
    fill_when: ["always"]
    requires_structure: []
    description: "Rentable square footage for the storage facility."
    extraction_rule: "Use storage rentable square footage when available. If the only value includes non-storage buildings or residential area, use it only if the OM presents it as the facility rentable square footage."
    pdf_aliases:
      - "Rentable Sq Ft"
      - "Rentable SF"
      - "Total Rentable Sqft"
      - "Total Rentable SF"
      - "Net Rentable Square Feet"

  - id: "napkin_vacancy"
    sheet: "Napkin"
    label_cell: "B33"
    value_cell: "C33"
    data_type: "number"
    source_period: "static"
    source_basis: "om_unit_mix"
    fill_when: ["unit_mix_present"]
    requires_structure: []
    description: "Current vacant unit count for the helper section, if the OM states a unit count."
    extraction_rule: "Use vacant unit count, not a vacancy percentage. Leave null if only vacancy rate is stated."
    pdf_aliases:
      - "Vacancy"
      - "Vacant Units"
      - "Number of Vacant Units"
      - "Vacancy Count"

  - id: "napkin_population"
    sheet: "Napkin"
    label_cell: "B36"
    value_cell: "C36"
    data_type: "number"
    source_period: "static"
    source_basis: "om_market_summary"
    fill_when: ["market_summary_present"]
    requires_structure: []
    description: "Population around the subject property."
    extraction_rule: "Prefer 3-mile population for self-storage market screening. Use another radius only if the OM does not provide 3-mile population, and cite the radius in reasoning."
    pdf_aliases:
      - "Population"
      - "Population in 3 Miles"
      - "3-Mile Population"
      - "Population (3 Mile)"
      - "Population in 1 Mile"
      - "Population in 5 Miles"

  - id: "napkin_population_growth_rate"
    sheet: "Napkin"
    label_cell: "B37"
    value_cell: "C37"
    data_type: "percentage"
    source_period: "static"
    source_basis: "om_market_summary"
    fill_when: ["market_summary_present"]
    requires_structure: []
    description: "Population growth rate around the subject property."
    extraction_rule: "Prefer 3-mile population growth. Leave null if the OM does not state population growth; do not infer it from population alone."
    pdf_aliases:
      - "Population Growth Rate"
      - "Population Growth Rate in 3 Miles"
      - "3-Mile Population Growth"
      - "Population Growth (3 Mile)"
      - "Population Growth Rate in 1 Mile"
      - "Population Growth Rate in 5 Miles"

# --- Napkin SHEET - Performa ---

  - id: "napkin_proforma_avg_effective_rent"
    sheet: "Napkin"
    label_cell: "F5"
    value_cell: "G5"
    data_type: "currency"
    source_period: "pro_forma"
    source_basis: "om_operating_statement"
    fill_when: ["pro_forma_operating_statement_present"]
    requires_structure: ["column_map.pro_forma"]
    description: "Pro forma or stabilized average effective monthly rent per storage unit."
    extraction_rule: "Use pro forma or stabilized average effective rent per storage unit per month. If not directly stated, derive it as: pro forma Gross Potential Rent ÷ total storage unit count ÷ 12. Do not use current/in-place rent. For self-storage, this is typically expressed as $/unit/month."
    pdf_aliases:
      - "Pro Forma Average Effective Rent"
      - "Stabilized Average Effective Rent"
      - "Proforma Average Rent"
      - "Market Average Rent"
      - "Average Market Rent"
      - "Pro Forma Avg Effective Rent"
      - "Stabilized Avg Eff Rent"
      - "Average Stabilized Rent"
      - "Pro Forma Average Monthly Rent"
      - "Projected Average Rent"
  
  - id: "napkin_proforma_other_income_per_unit"
    sheet: "Napkin"
    label_cell: "F6"
    value_cell: "G6"
    data_type: "currency"
    source_period: "pro_forma"
    source_basis: "om_operating_statement"
    fill_when: ["pro_forma_operating_statement_present"]
    requires_structure: ["column_map.pro_forma"]
    description: "Pro forma or stabilized annual other income per storage unit."
    extraction_rule: "Use pro forma or stabilized other income per storage unit annually. If not directly stated, derive it as: pro forma total other income ÷ total storage unit count. Do not use current other income per unit."
    pdf_aliases:
      - "Pro Forma Other Income per Unit"
      - "Stabilized Other Income per Unit"
      - "Proforma Other Income/Unit"
      - "Pro Forma Ancillary Income per Unit"
      - "Stabilized Ancillary Income per Unit"

  - id: "napkin_proforma_expense_per_unit"
    sheet: "Napkin"
    label_cell: "F10"
    value_cell: "G10"
    data_type: "currency"
    source_period: "pro_forma"
    source_basis: "om_operating_statement"
    fill_when: ["pro_forma_operating_statement_present"]
    requires_structure: ["column_map.pro_forma"]
    description: "Pro forma or stabilized operating expense per storage unit."
    extraction_rule: "Use pro forma or stabilized operating expenses divided by storage-only unit count. Do not use current or Year 1 expense per unit unless it is explicitly the stabilized/pro forma basis."
    pdf_aliases:
      - "Pro Forma Expense per Unit"
      - "Stabilized Expense per Unit"
      - "Proforma Operating Expense per Unit"
      - "Stabilized Operating Expense per Unit"
      - "Pro Forma Opex per Unit"

  - id: "napkin_stabilized_cap_rate"
    sheet: "Napkin"
    label_cell: "F11"
    value_cell: "G11"
    data_type: "percentage"
    source_period: "pro_forma"
    source_basis: "om_operating_statement"
    fill_when: ["pro_forma_operating_statement_present"]
    requires_structure: ["column_map.pro_forma"]
    description: "Pro forma or stabilized cap rate used by the Napkin pro forma screen."
    extraction_rule: "Use OM-stated pro forma or stabilized cap rate. Do not use current/walk-in cap rate or sale/exit cap rate."
    pdf_aliases:
      - "Pro Forma Cap Rate"
      - "Stabilized Cap Rate"
      - "Proforma Cap Rate"

  - id: "napkin_proforma_economic_vacancy_rate"
    sheet: "Napkin"
    label_cell: "F12"
    value_cell: "G12"
    data_type: "percentage"
    source_period: "pro_forma"
    source_basis: "om_operating_statement"
    fill_when: ["pro_forma_operating_statement_present"]
    requires_structure: ["column_map.pro_forma"]
    description: "Pro forma or stabilized economic vacancy rate for the Napkin pro forma screen."
    extraction_rule: "Use pro forma or stabilized economic vacancy / vacancy and credit loss. Do not use current vacancy, Year 1 vacancy, or physical vacancy alone."
    pdf_aliases:
      - "Pro Forma Economic Vacancy"
      - "Economic Vacancy (Pro Forma)"
      - "Proforma Vacancy Rate"
      - "Stabilized Vacancy Rate"
      - "Pro Forma Vacancy & Credit Loss"

  # Napkin new-development retail/mixed-use cells (L32:L40, O32:O33, Q32:Q33)
