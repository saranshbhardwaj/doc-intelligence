# Real Estate Investment Model Template - Version 1
# This schema defines critical fields with known locations in the Excel template
# Format: Define fingerprint cells for identification, then critical fields with their PDF aliases

schema_id: "re_investment_v1"
version: "1.0"
name: "RE Investment Model"
description: "Standard real estate investment analysis model with 21 sheets"

# Fingerprint cells - used to identify this template (check 3-5 unique cells)
fingerprint:
  - sheet: "DASHBOARD"
    cell: "B6"
    expected_value: "Unit Count"
  - sheet: "DASHBOARD"
    cell: "B8"
    expected_value: "Asking Price"
  - sheet: "DASHBOARD"
    cell: "B10"
    expected_value: "Purchase Price"

# Critical fields - define 50-100 most important fields
# Fields not defined here will be handled by generic analyzer + LLM
fields:
  # --- DASHBOARD SHEET - Property Info ---

  - id: "property_name"
    sheet: "DASHBOARD"
    label_cell: "B3"        # Cell containing the label
    value_cell: "C3"        # Cell where the value should be filled
    data_type: "text"
    pdf_aliases:            # What to look for in PDF (case-insensitive)
      - "Property Name"
      - "Property"
      - "Building Name"
      - "Asset Name"

  - id: "property_address"
    sheet: "DASHBOARD"
    label_cell: "B4"
    value_cell: "C4"
    data_type: "text"
    pdf_aliases:
      - "Property Address"
      - "Address"
      - "Location"
      - "Street Address"

  - id: "unit_count"
    sheet: "DASHBOARD"
    label_cell: "B6"
    value_cell: "C6"
    data_type: "number"
    pdf_aliases:
      - "Units"
      - "Unit Count"
      - "Total Units"
      - "# Units"
      - "Number of Units"

  # --- DASHBOARD SHEET - Purchase Section ---

  - id: "asking_price"
    sheet: "DASHBOARD"
    label_cell: "B8"
    value_cell: "C8"
    data_type: "currency"
    pdf_aliases:
      - "Asking Price"
      - "Listing Price"
      - "Sale Price"
      - "Offer Price"
      - "Price"

  - id: "purchase_price"
    sheet: "DASHBOARD"
    label_cell: "B10"
    value_cell: "C10"
    data_type: "currency"
    pdf_aliases:
      - "Purchase Price"
      - "Listing Price"
      - "Sale Price"
      - "Offer Price"
      - "Price"
  
  # --- DASHBOARD SHEET - DEBT section ---

  - id: "debt_down_payment_pct"
    sheet: "DASHBOARD"
    label_cell: "H5"
    value_cell: "J5"
    data_type: "percentage"
    pdf_aliases:
      - "Debt Down Payment"
      - "Down Payment"
      - "Debt Equity"
      - "Equity Contribution"
      - "DP Amount"

  - id: "debt_rate"
    sheet: "DASHBOARD"
    label_cell: "H6"
    value_cell: "J6"
    data_type: "percentage"
    pdf_aliases:
      - "Debt Rate"
  
  - id: "debt_i_o_mos"
    sheet: "DASHBOARD"
    label_cell: "H7"
    value_cell: "J7"
    data_type: "number"
    pdf_aliases:
      - "Debt I/O Period"

  - id: "debt_amort"
    sheet: "DASHBOARD"
    label_cell: "H8"
    value_cell: "J8"
    data_type: "number"
    pdf_aliases:
      - "Debt Amortization"

  # --- DASHBOARD SHEET - REFI Exit ---
  - id: "refi_cap_rate"
    sheet: "DASHBOARD"
    label_cell: "F29"
    value_cell: "I29"
    data_type: "percentage"
    pdf_aliases:
      - "Cap Rate at Refi"

  - id: "refi_loan_value"
    sheet: "DASHBOARD"
    label_cell: "F30"
    value_cell: "I30"
    data_type: "percentage"
    pdf_aliases:
      - "loan value at refi"
      - "LTV"
  
  - id: "refi_year_sale"
    sheet: "DASHBOARD"
    label_cell: "F31"
    value_cell: "I31"
    data_type: "number"
    pdf_aliases:
      - "Year sale"
      - "End of year"
  
  - id: "refi_cap_rate"
    sheet: "DASHBOARD"
    label_cell: "F32"
    value_cell: "I32"
    data_type: "percentage"
    pdf_aliases:
      - "Cap Rate at Sale"

  # --- DASHBOARD SHEET - Total equity shares ---
  - id: "class_b_per_hurdle_member"
    sheet: "DASHBOARD"
    label_cell: "K4"
    value_cell: "L4"
    data_type: "percentage"
    pdf_aliases:
      - "Class B % to Hurdle"
      - "Class B % to Preferred"
      - "Class B % to IRR Hurdle"
      - "Class B % to Preferred Return"
      - "LP Split"

  - id: "class_b_pref"
    sheet: "DASHBOARD"
    label_cell: "K6"
    value_cell: "L6"
    data_type: "percentage"
    pdf_aliases:
      - "Class B Preferred Return"
      - "Class B Pref"
